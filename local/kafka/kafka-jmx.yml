# JMX -> Prometheus mapping for the local broker. Mirrors the EKS rules so
# dashboards behave the same locally and in the cloud.
hostPort: kafka:5555     # where the broker exposes JMX (see compose JMX_PORT)
lowercaseOutputName: true
rules:
  # Per-topic messages-in / bytes — used to "track messages" on the dashboard.
  - pattern: kafka.server<type=(.+), name=(.+)PerSec, topic=(.+)><>Count
    name: kafka_server_$1_$2_total
    type: COUNTER
    labels:
      topic: "$3"
  # Broker-wide throughput counters.
  - pattern: kafka.server<type=(.+), name=(.+)PerSec><>Count
    name: kafka_server_$1_$2_total
    type: COUNTER
  # Replica health.
  - pattern: kafka.server<type=ReplicaManager, name=(.+)><>Value
    name: kafka_server_replicamanager_$1
    type: GAUGE
