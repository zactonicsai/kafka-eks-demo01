# Prometheus scrape configuration for the local stack.
global:
  scrape_interval: 5s        # scrape every 5s for a lively dashboard

scrape_configs:
  # 1) Kafka broker metrics via the JMX exporter.
  - job_name: "kafka"
    static_configs:
      - targets: ["kafka-exporter:5556"]

  # 2) Application metrics (messages produced/consumed) from the OTEL collector.
  - job_name: "otel-apps"
    static_configs:
      - targets: ["otel-collector:8889"]

  # 3) Prometheus self-monitoring.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
