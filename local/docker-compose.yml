# Local dev stack: a single-broker Kafka (KRaft), a Python producer + consumer,
# a JMX exporter, Prometheus, Grafana, and an OpenTelemetry Collector.
# This mirrors the cloud setup so you can develop/observe locally.
services:

  # ---- Kafka broker (KRaft mode, no ZooKeeper) ---------------------------
  kafka:
    image: bitnami/kafka:3.8
    container_name: kafka
    ports:
      - "9092:9092"   # client access from your host
    environment:
      # KRaft: this node is both controller and broker.
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # Listeners: PLAINTEXT for local simplicity (cloud uses TLS+SCRAM).
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Expose JMX so the exporter can read broker metrics.
      JMX_PORT: "5555"
      KAFKA_JMX_OPTS: "-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=kafka -Dcom.sun.management.jmxremote.rmi.port=5555 -Dcom.sun.management.jmxremote.port=5555"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---- JMX -> Prometheus exporter sidecar for Kafka ----------------------
  kafka-exporter:
    image: bitnami/jmx-exporter:1.0.1
    container_name: kafka-exporter
    command:
      - "5556"                                  # port Prometheus scrapes
      - "/opt/config/kafka-jmx.yml"             # mapping rules
    ports:
      - "5556:5556"
    volumes:
      - ./kafka/kafka-jmx.yml:/opt/config/kafka-jmx.yml:ro
    depends_on:
      kafka:
        condition: service_healthy

  # ---- OpenTelemetry Collector (OTEL) ------------------------------------
  # Receives OTLP traces/metrics from the Python clients and re-exposes
  # metrics in Prometheus format for scraping.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (clients push telemetry here)
      - "8889:8889"   # Prometheus exporter (Prometheus scrapes here)

  # ---- Prometheus --------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - kafka-exporter
      - otel-collector

  # ---- Grafana -----------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"   # local only; change for anything real
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # Auto-provision the Prometheus datasource + the Kafka dashboard.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ---- Python producer ---------------------------------------------------
  producer:
    build: ./producer
    container_name: producer
    environment:
      KAFKA_BOOTSTRAP: "kafka:9092"
      KAFKA_TOPIC: "demo-messages"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: "kafka-producer"
    depends_on:
      kafka:
        condition: service_healthy

  # ---- Python consumer ---------------------------------------------------
  consumer:
    build: ./consumer
    container_name: consumer
    environment:
      KAFKA_BOOTSTRAP: "kafka:9092"
      KAFKA_TOPIC: "demo-messages"
      KAFKA_GROUP: "demo-consumer-group"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: "kafka-consumer"
    depends_on:
      kafka:
        condition: service_healthy
